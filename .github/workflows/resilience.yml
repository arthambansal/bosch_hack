name: Resilience regression
on: [push, pull_request]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Offline contract and feature checks
        run: |
          python tests/test_contract_v5.py
          python tests/test_graph_mock.py
          python tests/test_regression.py
          python tests/test_report_v2.py
      - name: Require reviewed scenarios suitable for unattended CI
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from core.common import load_config
          cfg = load_config()
          files = sorted(p for p in Path('scenarios').glob('*.json') if not p.name.startswith('.'))
          if not files:
              raise SystemExit('No confirmed, reviewed scenarios committed; live CI is not validated yet.')
          for path in files:
              s = json.loads(path.read_text())
              steps = s['steps']
              if len(steps) != 1 or any(x['type'] not in ('kill', 'pause') or cfg['services'][x['target']]['stateful'] for x in steps):
                  raise SystemExit(f'{path}: CI permits one non-stateful kill/pause; use the human-gated local replay for other cases.')
          PY
      - name: Start base sandbox without fix overlays
        run: |
          python chaospilot.py up
          python - <<'PY'
          import time, requests
          for _ in range(60):
              try:
                  if all(requests.get(url, timeout=2).ok for url in ('http://localhost:8080/', 'http://localhost:8081/')):
                      break
              except requests.RequestException:
                  pass
              time.sleep(1)
          else:
              raise SystemExit('Sandbox did not become ready')
          PY
          python chaospilot.py map
          python chaospilot.py baseline --seconds 15
      - name: Replay all committed scenarios (current CLI syntax)
        run: python chaospilot.py replay
      - name: Preserve measured run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resilience-evidence
          path: |
            runs/
            scenarios/.status.json
      - name: Restore and stop disposable sandbox
        if: always()
        run: |
          python chaospilot.py panic
          docker compose -f sandbox/docker-compose.yml down
